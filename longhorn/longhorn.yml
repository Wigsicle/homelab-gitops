
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  sources:
    - chart: longhorn
      repoURL: https://charts.longhorn.io
      targetRevision: 1.13.0
      helm:
        values: |
          preUpgradeChecker:
            jobEnabled: false

          persistence:
            defaultClass: true
            defaultClassReplicaCount: 2

          defaultSettings:
            defaultReplicaCount: 2

  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
